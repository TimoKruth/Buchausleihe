name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      NG_BUILD_MAX_WORKERS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install declared npm version
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci --no-audit --no-fund
      - run: npm ls --all
      - run: npm audit
      - run: npm run lint
      - run: npm run test:security
      - run: npx tsc --project tsconfig.spec.json --noEmit
      - run: npm run build -- --progress=false
      - run: npm run build:production -- --progress=false
      - name: Run application tests in Chrome
        run: npm run test:ci -- --progress=false
